resources:
  jobs:
    health_data_job:
      name: health_data_job

      tasks:
        - task_key: run_health_pipeline

          spark_python_task:
            python_file: ../src/pipeline/main.py
            parameters:
              - ${var.catalog}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: []
