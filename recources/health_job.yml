resources:
  jobs:
    health_data_job:
      name: health_data_job

      tasks:
        - task_key: run_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/pipeline/main.py
            parameters:
              - ${var.catalog}

        - task_key: run_silver
          depends_on:
            - task_key: run_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/pipeline/silver.py
            parameters:
              - ${var.catalog}

        - task_key: run_gold
          depends_on:
            - task_key: run_silver
          environment_key: default
          spark_python_task:
            python_file: ../src/pipeline/gold.py
            parameters:
              - ${var.catalog}


      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: [ ]
