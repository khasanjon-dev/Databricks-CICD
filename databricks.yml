bundle:
  name: orders-cicd

workspace:
  host: https://dbc-a0541325-6964.cloud.databricks.com

resources:
  jobs:
    orders_pipeline:
      name: orders-pipeline-${bundle.target}

      tasks:
        - task_key: run_orders_pipeline
          spark_python_task:
            python_file: ./src/main.py
            source: WORKSPACE
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

targets:
  dev:
    default: true
    mode: development
